<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificador Bayes Ingenuo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <h1>Clasificador Bayes Ingenuo</h1>
    <p class="sub">Carga un dataset en CSV o Excel, elige la clase y los atributos, y evalúa el modelo.</p>
  </header>

  <section class="card">
    <h2><span class="num">1</span>Dataset</h2>
    <div class="cols">
      <div>
        <label>Archivo (.csv, .txt, .xlsx)
          <input type="file" id="datasetFile" accept=".csv,.txt,.xlsx,.xls">
        </label>
        <div class="hoja" hidden>
          <label>Hoja <select id="hojaDataset"></select></label>
          <small id="resumenDataset"></small>
        </div>
      </div>
      <div id="columnas" hidden>
        <label>Columna de clase <select id="columnaClase"></select></label>
      </div>
    </div>
    <div class="grupo">Atributos a usar</div>
    <div class="chips" id="atributos"></div>
  </section>

  <div class="cols fila">
    <section class="card">
      <h2><span class="num">2</span>Pruebas</h2>
      <label class="opcion"><input type="radio" name="modo" value="mismo" checked> Mismo dataset</label>
      <div class="indent" id="opcionesMismo">
        <label>Método de validación
          <select id="metodo">
            <option value="simple">Simple (X% entrenamiento)</option>
            <option value="estratificada">Aleatoria estratificada</option>
            <option value="cruzada">Validación cruzada (50%-50%)</option>
          </select>
        </label>
        <label id="lblPorcentaje">Porcentaje de entrenamiento
          <input type="number" id="porcentaje" value="70" min="1" max="99">
        </label>
      </div>

      <label class="opcion"><input type="radio" name="modo" value="externo"> Archivo de pruebas externo</label>
      <div class="indent" id="opcionesExterno">
        <input type="file" id="testFile" accept=".csv,.txt,.xlsx,.xls" disabled>
        <div class="hoja" hidden>
          <label>Hoja <select id="hojaPrueba"></select></label>
          <small id="resumenPrueba"></small>
        </div>
        <small>Las columnas se buscan por nombre. La clase es opcional.</small>
      </div>
    </section>

    <section class="card">
      <h2><span class="num">3</span>Variables continuas</h2>
      <label>Tratamiento
        <select id="continuas">
          <option value="normal">Distribución normal (densidad)</option>
          <option value="ancho">Discretizar: ancho igual</option>
          <option value="frecuencia">Discretizar: frecuencia igual</option>
        </select>
      </label>
      <label id="lblIntervalos" hidden>Número de intervalos
        <input type="number" id="intervalos" value="5" min="2">
      </label>
      <button id="analizar">Analizar</button>
      <div id="errores" role="alert"></div>
    </section>
  </div>

  <section id="resultados" class="card resultado" hidden>
    <div class="resumen">
      <div class="stat">
        <span>Accuracy</span>
        <strong id="accuracy"></strong>
        <small id="aciertos"></small>
      </div>
      <p id="info" class="sub"></p>
    </div>
    <h3>Matriz de confusión</h3>
    <div class="scroll" id="matriz"></div>
    <h3>Métricas de evaluación</h3>
    <div class="scroll" id="metricas"></div>
  </section>

  <section id="predicciones" class="card" hidden>
    <h3>Predicciones</h3>
    <div class="scroll" id="tablaPred"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
